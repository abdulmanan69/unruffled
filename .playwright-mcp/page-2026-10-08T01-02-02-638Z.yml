        - paragraph [ref=e206]: Scope
        - heading "unruffled renders nothing." [level=2] [ref=e207]
        - paragraph [ref=e208]:
          - text: No CSS, no widgets, no design system, ever. It emits values,
          - code [ref=e209]: data-*
          - text: attributes and props you spread onto your own markup, so it composes over whatever you already use. The list below is what it will never build, because those tiers are solved and defended by ten to a hundred times the distribution.
      - list [ref=e210]:
        - listitem [ref=e211]: Buttons, cards, inputs, badges, avatars
        - listitem [ref=e212]: Dialogs, drawers, sheets
        - listitem [ref=e213]: Toast renderers
        - listitem [ref=e214]: Command palettes
        - listitem [ref=e215]: Date pickers and calendars
        - listitem [ref=e216]: Data tables and grids
        - listitem [ref=e217]: Skeleton shapes and spinners
