        - paragraph [ref=e176]: Why this exists
        - heading "The gap is measurable, so we measured it." [level=2] [ref=e177]
        - paragraph [ref=e178]: "Before writing any code, fifteen agents surveyed the React component-library ecosystem: shadcn/ui, Radix, MUI, Chakra, Mantine, Headless UI, Ark UI, React Aria, Motion, Vaul, Sonner, cmdk, driver.js and TanStack Query. These are counts from their shipped source, not impressions."
      - generic [ref=e179]:
        - generic [ref=e180]:
          - term [ref=e181]: 0 of 61
          - definition [ref=e182]: shadcn/ui registry components using aria-live
        - generic [ref=e183]:
          - term [ref=e184]: 0 of 61
          - definition [ref=e185]: using useActionState, useTransition or isPending
        - generic [ref=e186]:
          - term [ref=e187]: 0 of 316
          - definition [ref=e188]: doc pages mentioning useOptimistic
        - generic [ref=e189]:
          - term [ref=e190]: 4 of 111
          - definition [ref=e191]: Aceternity UI components handling reduced motion
      - paragraph [ref=e192]: Static presentation is solved. Overlay accessibility is solved. Toasts, palettes and date pickers are solved several times over. What is not solved is the lifecycle of an action, and that is the only thing this library does.
    - separator [ref=e193]
    - generic [ref=e194]:
      - generic [ref=e195]:
        - paragraph [ref=e196]: The part you cannot lint your way to
        - heading "It tells you which call sites are still wrong." [level=2] [ref=e197]
        - paragraph [ref=e198]: Every machine emits a transition stream, and a development-only bus reads it. Nine stable codes, each firing when the wiring is wrong rather than when a feature is merely switched on.
      - generic "Example console output" [ref=e199]:
        - code [ref=e200]: "[unruffled UX1001] Destructive action has neither a confirmation nor an undo path An irreversible action can be triggered by a single mis-click or a stray Enter on a focused control, and the user has no way back. Fix: Either wrap the action in useConfirm, or give it an undo window with useUndoable. One of the two is required when destructive is true. Site: DeleteCustomerButton (src/customers/DeleteCustomerButton.tsx:24:18) Docs: https://abdulmanan69.github.io/unruffled/diagnostics/ux1001/ Suppress: diagnostics.suppress(\"UX1001\")"
      - paragraph [ref=e201]:
        - text: Production builds contain none of it. The rule table lives on its own subpath, so the strings are not merely dead code behind a flag — they are not in the module graph at all.
        - link "See all nine rules" [ref=e202] [cursor=pointer]:
          - /url: /unruffled/diagnostics/
        - text: .
